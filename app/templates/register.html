{% extends "base.html" %}

{% block title %}Cadastro{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}" />
{% endblock %}

{% block content %}

<h2 style="margin-bottom:20px; text-align:center;">Criar conta</h2>

{% if erro %}
<p style="margin-bottom:20px; text-align:center; color:#b42318;">{{ erro }}</p>
{% endif %}

<form method="POST" style="display:flex; flex-direction:column; gap:15px; align-items:center; max-width:400px; margin:0 auto;">
  
  <div>
    <label>Nome</label>
    <input 
      type="text" 
      name="nome" 
      value="{{ form_data.nome if form_data else '' }}"
      required
      style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-top:5px;"
    >
  </div>

  <div>
    <label>Email</label>
    <input 
      type="email" 
      name="email" 
      value="{{ form_data.email if form_data else '' }}"
      required
      style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-top:5px;"
    >
  </div>

  <div>
    <label>Senha</label>
    <input 
      type="password" 
      name="senha" 
      required
      style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-top:5px;"
    >
  </div>

  <div>
    <label>Tipo de conta</label>
    <select 
      name="tipo"
      style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-top:5px;"
    >
      <option value="usuario" {% if form_data and form_data.tipo == 'usuario' %}selected{% endif %}>Usuário</option>
      <option value="organizador" {% if form_data and form_data.tipo == 'organizador' %}selected{% endif %}>Organizador</option>
    </select>
  </div>

  <button type="submit" class="btn btn_primary" style="width:200px;">
    Cadastrar
  </button>

</form>

<div style="margin-top:20px; text-align:center;">
  <span>Já tem conta?</span>
  <a href="/auth/login" class="btn btn_outline" style="margin-left:10px;">
    Entrar
  </a>
</div>

{% endblock %}
